<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mao Sub Indo - Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .player-card {
      width: 100%;
      max-width: 900px;
      background: #151d2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #233044;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .info-section {
      padding: 20px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #243147;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #33435e;
    }
    .url-box {
      margin-top: 16px;
      padding: 12px;
      background: #0b0e14;
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="video-container">
      <video id="vplayer" controls autoplay playsinline preload="auto">
        <source src="https://storage.animekita.org/ro/f6ed-1786184742343.mp4" type="video/mp4">
        Browser Anda tidak mendukung video tag.
      </video>
    </div>
    <div class="info-section">
      <div class="title">Mao Sub Indo - Episode al-153303-1</div>
      <div class="subtitle">Direct Stream Link | Source: AnimeKita / Ylnime</div>
      <div class="controls-row">
        <a id="downloadBtn" href="https://storage.animekita.org/ro/f6ed-1786184742343.mp4" target="_blank" download class="btn">
          ⬇️ Download MP4
        </a>
        <button onclick="copyUrl()" class="btn btn-secondary">
          📋 Salin URL Video
        </button>
      </div>
      <div class="url-box" id="mp4UrlDisplay">
        https://storage.animekita.org/ro/f6ed-1786184742343.mp4
      </div>
    </div>
  </div>

  <script>
    function copyUrl() {
      const url = document.getElementById('mp4UrlDisplay').innerText.trim();
      navigator.clipboard.writeText(url).then(() => {
        alert('URL Video berhasil disalin!');
      });
    }
  </script>
</body>
</html>
